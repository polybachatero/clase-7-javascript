<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Registro</title>
</head>
<body>
    <main class="registro">
        <h1>Crear una cuenta</h1>
        <p class="descripcion">Completa tus datos para registrarte.</p>

        <form onsubmit="registro(event)" id="formulario>
            <label for="email">
                Email
                <input type="email" id="email" name="email" autocomplete="email" placeholder="nombre@ejemplo.com" required>
            </label>

            <label for="password">
                Contraseña
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </label>

            <label for="confirmacion">
                Confirmación de contraseña
                <input type="password" id="confirmacion" name="confirmacion" autocomplete="new-password" required>
            </label>

            <button id="btn" type="submit">Registrarme</button>
        </form>
    </main>
    

    <script src="script.js"></script>
</body>
</html>
